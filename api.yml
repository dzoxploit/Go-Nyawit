openapi: 3.0.0

info:
  title: Estate Service
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /estate:
    post:
      operationId: PostEstate
      summary: Create estate

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstateRequest'

      responses:
        '201':
          description: Estate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstateResponse'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
   /estate/{id}/tree:
    post:
      operationId: PostEstateIdTree
      summary: Add tree into estate

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTreeRequest'

      responses:
        '201':
          description: Tree created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Estate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    CreateEstateRequest:
      type: object
      required:
        - width
        - length

      properties:
        width:
          type: integer
          minimum: 1
          maximum: 50000

        length:
          type: integer
          minimum: 1
          maximum: 50000

    EstateResponse:
      type: object

      properties:
        id:
          type: string
          format: uuid

    ErrorResponse:
      type: object

      properties:
        message:
          type: string

          
    CreateTreeRequest:
      type: object

      required:
        - x
        - y
        - height

      properties:
        x:
          type: integer

        y:
          type: integer

        height:
          type: integer
          minimum: 1
          maximum: 30

    TreeResponse:
      type: object

      properties:
        id:
          type: string
          format: uuid
    